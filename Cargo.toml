[package]
name = "steady-ink"
version = "0.0.3"
edition = "2024"
rust-version = "1.92"
authors = ["Enigfrank"]
description = "Windows-only teaching screen annotation software"
license = "GPL-3.0-or-later"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
crc32fast = "1.5.0"
directories = "6.0.0"
egui = "0.35.0"
egui-winit = { version = "0.35.0", default-features = false }
raw-window-handle = "0.6.2"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
skia-safe = { version = "0.99.0", features = ["d3d"] }
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "local-offset"] }
toml = "0.9.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "time"] }
winit = "0.30"
zstd = "0.13.3"

[build-dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[bench]]
name = "performance_monitor"
harness = false
